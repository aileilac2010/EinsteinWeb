<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>EinsteinWeb</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="topbar">

      <div class="brand">
        <div class="brand-icon">E</div>

        <div>
          <div class="brand-name">Einstein</div>
          <div class="brand-version">V0.5</div>
        </div>
      </div>

      <div class="status">
        <span class="status-dot"></span>
        <span>Online</span>
      </div>

    </header>


    <!-- =====================================================
         MODE SELECTOR
    ====================================================== -->

    <div class="mode-container">

      <button
        class="mode-btn active"
        data-subject="math"
      >
        <span>∑</span>
        Matemática
      </button>

      <button
        class="mode-btn"
        data-subject="physics"
      >
        <span>⚡</span>
        Física
      </button>

      <button
        class="mode-btn"
        data-subject="chemistry"
      >
        <span>⚗</span>
        Química
      </button>

    </div>


    <!-- =====================================================
         WORKSPACE
    ====================================================== -->

    <main class="workspace">

      <section class="calculator">

        <div class="calculator-header">

          <div>
            <div
              class="calculator-title"
              id="calculatorTitle"
            >
              Calculadora Matemática
            </div>

            <div
              class="calculator-subtitle"
              id="calculatorSubtitle"
            >
              Digite usando o teclado Einstein
            </div>
          </div>

          <button
            class="clear-all"
            id="clearAll"
            title="Limpar"
          >
            C
          </button>

        </div>


        <!-- =================================================
             DISPLAY
        ================================================== -->

        <div class="display">

          <div
            id="problemDisplay"
            class="problem-display"
          >
            <span class="placeholder">
              Toque nas teclas abaixo...
            </span>
          </div>

          <div class="display-controls">

            <button
              id="undoBtn"
              class="small-control"
            >
              ↶
            </button>

            <button
              id="cursorLeft"
              class="small-control"
            >
              ←
            </button>

            <button
              id="cursorRight"
              class="small-control"
            >
              →
            </button>

            <button
              id="backspaceBtn"
              class="small-control delete"
            >
              ⌫
            </button>

          </div>

        </div>


        <!-- =================================================
             SOLVE BUTTON
        ================================================== -->

        <button
          id="solveBtn"
          class="solve-button"
        >
          <span>✦</span>
          Resolver
        </button>


        <!-- =================================================
             KEYBOARD
        ================================================== -->

        <section class="keyboard-container">

          <!-- CATEGORY TABS -->

          <div
            id="keyboardTabs"
            class="keyboard-tabs"
          ></div>


          <!-- KEYBOARD -->

          <div
            id="keyboard"
            class="keyboard"
          ></div>

        </section>

      </section>


      <!-- ===================================================
           RESULT
      ==================================================== -->

      <section
        id="resultSection"
        class="result-section hidden"
      >

        <div class="result-header">

          <div>
            <div class="result-label">
              RESULTADO
            </div>

            <div
              id="resultAnswer"
              class="result-answer"
            ></div>
          </div>

        </div>


        <!-- STEPS -->

        <div
          id="stepsContainer"
          class="steps-container"
        ></div>


        <!-- METHODS -->

        <div
          id="methodsContainer"
          class="methods-container"
        ></div>


        <!-- LEARNING -->

        <div
          id="learningContainer"
          class="learning-container"
        ></div>


        <!-- GRAPH -->

        <div
          id="graphContainer"
          class="graph-container hidden"
        >

          <div class="graph-title">
            Gráfico
          </div>

          <canvas
            id="graphCanvas"
          ></canvas>

        </div>

      </section>


      <!-- ERROR -->

      <div
        id="errorBox"
        class="error-box hidden"
      ></div>

    </main>

  </div>


  <script src="script.js"></script>

</body>
</html>
