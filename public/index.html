<!DOCTYPE html>
<html lang="pt">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EinsteinWeb</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="brand">

            <div class="logo">
                E
            </div>

            <div>
                <h1>EinsteinWeb</h1>
                <span>Einstein Brain V0.4</span>
            </div>

        </div>

        <div
            id="status"
            class="status"
        >
            <span class="status-dot"></span>
            Online
        </div>

    </header>


    <!-- MAIN -->

    <main class="main">

        <section class="hero">

            <h2>
                Resolve problemas.
                <span>Aprende o processo.</span>
            </h2>

            <p>
                Matemática, Física e Química,
                com resolução passo a passo.
            </p>

        </section>


        <!-- SUBJECTS -->

        <div class="subjects">

            <button
                class="subject active"
                data-subject="math"
            >
                <span class="subject-symbol">∑</span>
                <span>
                    <strong>Matemática</strong>
                    <small>Álgebra e cálculos</small>
                </span>
            </button>

            <button
                class="subject"
                data-subject="physics"
            >
                <span class="subject-symbol">F</span>
                <span>
                    <strong>Física</strong>
                    <small>Fórmulas e grandezas</small>
                </span>
            </button>

            <button
                class="subject"
                data-subject="chemistry"
            >
                <span class="subject-symbol">⚗</span>
                <span>
                    <strong>Química</strong>
                    <small>Mol, massa e concentração</small>
                </span>
            </button>

        </div>


        <!-- INPUT -->

        <section class="solver">

            <label for="problem">
                O que queres resolver?
            </label>

            <textarea
                id="problem"
                placeholder="Ex.: 2x² + 5x - 3 = 0"
                rows="5"
            ></textarea>

            <div class="solver-bottom">

                <span id="selectedSubject">
                    Matemática
                </span>

                <button
                    id="solveButton"
                    class="solve-button"
                >
                    <span id="buttonText">
                        Resolver
                    </span>

                    <span
                        id="spinner"
                        class="spinner"
                    ></span>
                </button>

            </div>

        </section>


        <!-- EXAMPLES -->

        <section class="examples">

            <span>Exemplos:</span>

            <button data-example="2x² + 5x - 3 = 0">
                2x² + 5x - 3 = 0
            </button>

            <button data-example="25 × 4 + 10">
                25 × 4 + 10
            </button>

            <button data-example="Um carro percorre 120 km em 2 horas. Qual é a velocidade média?">
                Velocidade média
            </button>

        </section>


        <!-- ERROR -->

        <div
            id="error"
            class="error hidden"
        ></div>


        <!-- RESULT -->

        <section
            id="result"
            class="result hidden"
        >

            <div class="answer-card">

                <span class="answer-label">
                    RESPOSTA
                </span>

                <div
                    id="answer"
                    class="answer"
                ></div>

            </div>


            <div class="result-grid">

                <div>

                    <h3>Resolução passo a passo</h3>

                    <div
                        id="steps"
                        class="steps"
                    ></div>

                </div>


                <aside>

                    <div class="info-card">

                        <h3>Métodos</h3>

                        <div
                            id="methods"
                        ></div>

                    </div>


                    <div class="info-card">

                        <h3>Aprende</h3>

                        <div
                            id="learning"
                        ></div>

                    </div>

                </aside>

            </div>

        </section>

    </main>


    <footer>
        EinsteinWeb • Einstein Brain V0.4
    </footer>

</div>


<script src="/app.js"></script>

</body>
</html>
